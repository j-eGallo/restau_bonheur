services:
  backend:
    build:
      context: ./backend
    container_name: restau_bonheur_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: "mysql://root:root@database:3306/restau_bonheur?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    container_name: restau_bonheur_frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  database:
    image: mysql:8.0
    container_name: restau_bonheur_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restau_bonheur
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: restau_bonheur_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - database

volumes:
  database_data: