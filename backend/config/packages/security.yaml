security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        restaurateur_provider:
            entity:
                class: App\Entity\Restaurateur
                property: email

        client_provider:
            entity:
                class: App\Entity\Client
                property: email

        app_provider:
            chain:
                providers:
                    - restaurateur_provider
                    - client_provider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login_restaurateur:
            pattern: ^/api/loginRestaurateur
            stateless: true

            json_login:
                check_path: /api/loginRestaurateur
                username_path: email
                password_path: password

                provider: restaurateur_provider

                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        login_client:
            pattern: ^/api/loginClient
            stateless: true

            json_login:
                check_path: /api/loginClient
                username_path: email
                password_path: password

                provider: client_provider

                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api_client:
            pattern: ^/api/client
            stateless: true
            provider: client_provider
            jwt: ~

        api_reservation:
            pattern: ^/api/reservation
            stateless: true
            provider: client_provider
            jwt: ~

        api:
            pattern: ^/api
            stateless: true
            provider: app_provider
            jwt: ~

    access_control:
        - { path: ^/api/restaurant/by-type, roles: PUBLIC_ACCESS }
        - { path: ^/api/reservation/threeLastRes, roles: PUBLIC_ACCESS }
        - { path: ^/api/restaurant/latest, roles: PUBLIC_ACCESS }
        - { path: ^/api/restaurant/get, roles: PUBLIC_ACCESS }
        - { path: ^/api/restaurant/RestauPlusPop, roles: PUBLIC_ACCESS }
        - { path: ^/api/type-cuisine/get, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc.json, roles: PUBLIC_ACCESS }

        - { path: ^/api/avis/getAvis, roles: PUBLIC_ACCESS }
        - { path: ^/api/type-cuisine/add, roles: PUBLIC_ACCESS }

        - { path: ^/api/registerRestaurateur, roles: PUBLIC_ACCESS }
        - { path: ^/api/loginRestaurateur, roles: PUBLIC_ACCESS }

        - { path: ^/api/registerClient, roles: PUBLIC_ACCESS }
        - { path: ^/api/loginClient, roles: PUBLIC_ACCESS }

        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
