name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, intl, zip
          tools: composer

      - name: Créer le fichier .env pour la CI
        working-directory: ./backend
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_DEBUG=0" >> .env
          echo "APP_SECRET=github-actions-test-secret" >> .env

      - name: Installer les dépendances backend
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier la configuration Symfony
        working-directory: ./backend
        run: php bin/console about

      - name: Vérifier les routes Symfony
        working-directory: ./backend
        run: php bin/console debug:router
